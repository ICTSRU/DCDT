<title>Data Center Twin Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout concept: SRU operations console. White brand bar, purple-blue network band, tab bar,
   then a dashboard (floor plan drives rack detail, search, placement what-if, alerts)
   and a Settings page (room limits, racks, rack contents) that feeds the dashboard from the Google Sheet. */
:root{
  --bg:#f7f5fb; --surface:#ffffff; --ink:#241436; --muted:#6b5a80; --line:rgba(80,30,140,.14);
  --brand:#501e8c; --brand-d:#3a1464; --brand-l:#f0ebf8; --accent:#501e8c; --blue:#0a6eaa; --blue-l:#e6f3fa;
  --good:#1b7f4b; --warn:#a85f00; --crit:#c0262d;
  --c-server:#0a6eaa; --c-storage:#7a3fc2; --c-network:#13817a; --c-security:#b4531a; --c-other:#6b5a80;
  --font:"Cairo",Tahoma,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150f1f; --surface:#1f1730; --ink:#efe9f8; --muted:#aa9bc0; --line:rgba(190,160,240,.2);
  --brand:#6b34b8; --brand-l:#2b2042; --accent:#c9b0f7; --blue:#5cb4ea; --blue-l:#16293a;
  --good:#4cc38a; --warn:#f0a73a; --crit:#ff7b80;
  --c-server:#5cb4ea; --c-storage:#b794f0; --c-network:#4fd1c5; --c-security:#f0a06a; --c-other:#aa9bc0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150f1f; --surface:#1f1730; --ink:#efe9f8; --muted:#aa9bc0; --line:rgba(190,160,240,.2);
  --brand:#6b34b8; --brand-l:#2b2042; --accent:#c9b0f7; --blue:#5cb4ea; --blue-l:#16293a;
  --good:#4cc38a; --warn:#f0a73a; --crit:#ff7b80;
  --c-server:#5cb4ea; --c-storage:#b794f0; --c-network:#4fd1c5; --c-security:#f0a06a; --c-other:#aa9bc0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.brandbar{background:#fff;border-bottom:3px solid var(--brand);direction:ltr}
.brandbar .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding-block:10px}@media (max-width:640px){.brandbar .wrap{justify-content:center}.logos{gap:12px}}
.logos{display:flex;align-items:center;gap:18px;min-height:40px;min-width:0}.logos img{height:40px;width:auto;max-width:100%;display:block}
.mark{display:flex;flex-direction:column;justify-content:center;min-height:40px;line-height:1.15;color:#3a1464}
.mark b{font-size:15px;font-weight:700}
.mark small{font-size:10.5px;color:#6b5a80}
.mark.r{text-align:right}

.tech{position:relative;overflow:hidden;color:#fff;background:linear-gradient(110deg,#501e8c,#4a1f8a 45%,#2b3f9e)}
.tech.dark{background:linear-gradient(110deg,#3a1464,#2e2a80)}
.tech::before{content:"";position:absolute;inset:0;background-image:var(--net);background-size:520px 200px;background-repeat:repeat;animation:drift 40s linear infinite;pointer-events:none}
.tech>*{position:relative}
@keyframes drift{to{background-position-x:-520px}}
@media (prefers-reduced-motion:reduce){.tech::before{animation:none}}

.band .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:20px}
.band h1{margin:0;font-size:26px;font-weight:700;line-height:1.2;text-wrap:balance}
.band p{margin:2px 0 0;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.45);border-radius:4px;padding:3px 10px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1)}
.chip.ver{background:#fff;color:#3a1464;border-color:#fff}
.btn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:4px;padding:5px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--brand-l)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:2px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.band .btn{border-color:#fff;background:transparent;color:#fff}
.band .btn:hover{background:rgba(255,255,255,.15)}

.nav{background:var(--surface);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:4px;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 18px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--brand)}

main{padding-block:20px 32px;display:grid;gap:16px}
#d-body,#view-set{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{font-size:28px;font-weight:700;line-height:1.2}
.val{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.summary{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted)}
.kpi .n{color:var(--muted);font-size:12px}
.meter{height:6px;border-radius:3px;background:var(--brand-l);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.kpi.bad .v{color:var(--crit)}

.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card h3{margin:14px 0 8px;font-size:14px;font-weight:700}
.tabs{display:inline-flex;border:1px solid var(--accent);border-radius:4px;overflow:hidden}
.tabs button{background:transparent;border:0;padding:4px 14px;cursor:pointer;color:var(--accent);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff}
.scroll{overflow-x:auto}
.plan{direction:ltr}
.plan svg{display:block;width:100%;height:auto}
.rk{fill:color-mix(in srgb,var(--st) 16%,var(--surface));stroke:var(--st);stroke-width:1.5}
.s-good{--st:var(--good)}.s-warn{--st:var(--warn)}.s-crit{--st:var(--crit)}.s-none{--st:var(--muted)}
g.rack{cursor:pointer}
g.rack:hover .rk{fill:color-mix(in srgb,var(--st) 28%,var(--surface))}
g.rack.sel .rk{stroke:var(--accent);stroke-width:3.5}
.fit{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;margin-top:8px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--st);background:color-mix(in srgb,var(--st) 25%,var(--surface));vertical-align:-2px;margin-inline-end:4px}
.pill{display:inline-block;border-radius:4px;padding:0 8px;font-size:11.5px;font-weight:700;border:1px solid var(--st);color:var(--st);background:color-mix(in srgb,var(--st) 12%,var(--surface));white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--bg)}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:18px;font-weight:700}
.detail{display:flex;gap:16px;flex-wrap:wrap}
.elev{flex:0 0 150px}
.elev svg{display:block}
.edev{cursor:pointer}
.edev:hover rect{filter:brightness(1.1)}
.detail .right{flex:1 1 280px;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;color:var(--muted);font-size:11.5px;font-weight:600;border-bottom:1px solid var(--line);padding:4px 6px;white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.m{font-family:var(--mono);font-size:12px;white-space:nowrap}
tr[data-dev]{cursor:pointer}
tr.sel{background:var(--brand-l)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
.devcard{margin-top:10px;border:1px solid var(--accent);border-radius:4px;padding:10px 12px;background:var(--brand-l)}
.devcard dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin:6px 0 0}
.devcard dt{font-size:11.5px;color:var(--muted);font-weight:600}
.devcard dd{margin:0;word-break:break-word}

input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}
label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label small{font-weight:400}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
.fgrid .full{grid-column:1/-1}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
.form label{width:130px}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px}
.best{border:1px solid var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface));border-radius:4px;padding:8px 12px;margin-bottom:8px}
.best.no{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,var(--surface))}
.best b{font-size:16px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:260px;overflow:auto}
.list li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 8px;border:1px solid var(--line);border-radius:4px;flex-wrap:wrap}
.list button.link,button.link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.muted{color:var(--muted)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:28px 12px}
.empty h2{justify-content:center}
.sel-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.sel-row label{min-width:220px}
.err{color:var(--crit);font-weight:600;min-height:1.4em;margin:8px 0 0}

.overlay{position:fixed;inset:0;background:rgba(20,10,35,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:4px;width:min(680px,100%);padding:16px 18px;margin-block:auto}
.dlg h2{margin:0 0 12px;font-size:18px}
.dlgbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;inset-inline:0;bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast span{background:var(--brand-d);color:#fff;border-radius:4px;padding:8px 16px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#toast span.bad{background:var(--crit)}

footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding-block:16px;font-size:12.5px}
footer a{color:#fff;font-weight:700}
footer .chip{background:rgba(255,255,255,.14)}

@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.band h1{font-size:21px}.stat .v{font-size:16px}.form label{width:calc(50% - 5px)}}
.photosec h3{margin:10px 0 4px;font-size:13px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pthumb{position:relative;width:104px;height:78px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--bg);cursor:zoom-in;padding:0}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb.ld{cursor:default;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center}
.pdel{position:absolute;top:3px;inset-inline-end:3px;min-width:22px;height:22px;border-radius:11px;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:22px;cursor:pointer;padding:0 5px}
.pdel.arm{background:#c0392b}
.photoedit{grid-column:1/-1}
.photoedit .lbl{font-weight:600;margin-bottom:4px}
#lightbox{z-index:80;align-items:center;background:rgba(10,5,20,.88)}
.lb{display:flex;flex-direction:column;align-items:center;gap:10px;margin:auto;max-width:100%}
.lb img{max-width:min(96vw,1400px);max-height:78vh;object-fit:contain;background:#000;border-radius:4px}
.lbbar{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;direction:ltr}
.lbbar button{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:4px;min-width:40px;height:36px;font-size:18px;cursor:pointer}
.lbbar button:hover{background:rgba(255,255,255,.25)}
</style>

/* ───────── backend call: Apps Script in production, browser storage in demo ───────── */
function call(fn,...args){
  return new Promise((res,rej)=>{
    if(IS_GAS){try{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)}catch(e){rej(e)}}
    else{try{res(demo[fn](...args))}catch(e){rej(e)}}
  });
}
function errMsg(e){
  const m=String((e&&e.message)||e||'');
  if(/authori[sz]ation|permission/i.test(m)&&!/E_[A-Z_]+/.test(m))return t('errAuth');
  const x=/(E_[A-Z_]+)(?:\|([^\n]*))?/.exec(m);
  if(x){
    const f=I[S.lang].err[x[1]];
    if(f){
      if(x[1]==='E_SET'){const lab=SETLAB[x[2]];return t('err').E_SET(lab?t(lab):x[2])}
      return typeof f==='function'?f(x[2]):f;
    }
  }
  return t('errGeneric')+' '+m.slice(0,160);
}

/* ───────── derived data ───────── */
const rackById=id=>DB.racks.find(r=>r.RackID===id);
function occupancy(r,excludeId){
  const occ=new Array(r.TotalU+2).fill(0);
  DB.devices.forEach(d=>{if(d.RackID===r.RackID&&d.DeviceID!==excludeId&&occupies(d))for(let i=d.StartU;i<d.StartU+d.HeightU&&i<=r.TotalU;i++)occ[i]=1});
  return occ;
}
function freeRanges(r,excludeId){
  const occ=occupancy(r,excludeId),out=[];let s=0;
  for(let i=1;i<=r.TotalU+1;i++){
    if(i<=r.TotalU&&!occ[i]){if(!s)s=i}
    else if(s){out.push(s===i-1?String(s):s+'–'+(i-1));s=0}
  }
  return out;
}
function enrich(){
  const TH=DB.settings;
  DB.racks.forEach(r=>{
    r.devs=DB.devices.filter(d=>d.RackID===r.RackID).sort((a,b)=>b.StartU-a.StartU);
    r.usedU=0;r.kw=0;
    r.devs.forEach(d=>{if(occupies(d))r.usedU+=d.HeightU;if(draws(d))r.kw+=d.PowerW});
    r.pct=r.PowerCapW?r.kw/r.PowerCapW*100:0;
    r.free=Math.max(0,r.TotalU-r.usedU);
    const occ=occupancy(r);let run=0,best=0;
    for(let i=1;i<=r.TotalU;i++){if(occ[i])run=0;else{run++;best=Math.max(best,run)}}
    r.block=best;
    r.t=(r.InletTempC===null||r.InletTempC===undefined||r.InletTempC==='')?null:Number(r.InletTempC);
    const age=r.ReadingAt?(Date.now()-Date.parse(r.ReadingAt))/60000:0;
    r.stale=!!(TH.StaleMinutes>0&&r.t!==null&&r.ReadingAt&&age>TH.StaleMinutes);r.age=Math.round(age);
  });
}
function stateOf(m,v){
  const T=DB.settings;
  if(m==='power')return v>=T.PowerCritPct?'crit':v>=T.PowerWarnPct?'warn':'good';
  if(m==='temp')return v===null?'none':v>=T.TempCritC?'crit':v>=T.TempWarnC?'warn':'good';
  return v>=T.SpaceCritPct?'crit':v>=T.SpaceWarnPct?'warn':'good';
}
const metricVal=(r,m)=>m==='power'?r.pct:m==='temp'?r.t:(r.TotalU?r.usedU/r.TotalU*100:0);
function alerts(){
  const a=[];
  DB.racks.forEach(r=>{
    const sp=stateOf('power',r.pct);if(sp!=='good')a.push({sev:sp,k:'power',r:r.RackID,v:Math.round(r.pct)});
    const st=stateOf('temp',r.t);if(st!=='good'&&st!=='none')a.push({sev:st,k:'temp',r:r.RackID,v:f1(r.t)});
    if(r.stale)a.push({sev:'warn',k:'stale',r:r.RackID,v:r.age});
  });
  return a.sort((x,y)=>(y.sev==='crit')-(x.sev==='crit'));
}
function fitList(){
  const u=Math.max(1,Math.min(60,Math.round(+$('wu').value)||1)),kw=Math.max(1,+$('wk').value||1),T=DB.settings;
  return DB.racks.map(r=>{
    const why=[];
    if(r.block<u)why.push('rSpace');
    const lim=r.PowerCapW*T.PlanPowerPct/100;
    if(r.kw+kw>lim+1e-9)why.push('rPower');
    if(r.t!==null&&r.t>T.PlanTempC)why.push('rTemp');
    return{r,why,left:lim-(r.kw+kw)};
  }).sort((a,b)=>(a.why.length-b.why.length)||(b.left-a.left)||nat(a.r.RackID,b.r.RackID));
}
const rackLabel=r=>r.Name&&r.Name!==r.RackID?`${r.RackID} · ${r.Name}`:r.RackID;

/* ───────── shared drawing: rack elevation ───────── */
function elev(r,selId,mode){
  const U=r.TotalU,UH=10,top=4,h=U*UH+8;
  let e=`<svg width="150" height="${h}" viewBox="0 0 150 ${h}" role="img" aria-label="${esc(t('rack'))} ${esc(r.RackID)} ${U}U" font-family="Cairo,Tahoma,Arial,sans-serif" style="direction:ltr"><rect x="30" y="2" width="112" height="${U*UH+4}" rx="3" fill="var(--bg)" stroke="var(--muted)"/>`;
  for(let i=1;i<U;i++)e+=`<line x1="30" x2="142" y1="${top+i*UH}" y2="${top+i*UH}" stroke="var(--line)"/>`;
  for(let u=1;u<=U;u++)if(u===1||u%5===0)e+=`<text x="26" y="${top+(U-u)*UH+UH-2}" font-size="9.5" fill="var(--muted)" text-anchor="end">${u}</text>`;
  r.devs.forEach(d=>{
    if(!occupies(d))return;
    const topU=d.StartU+d.HeightU-1,y=top+(U-topU)*UH;if(y<top-1||d.StartU>U)return;
    const c=TCOL[d.Type]||TCOL.other,attr=mode==='set'?`data-act="editDev" data-id="${esc(d.DeviceID)}"`:`data-dev="${esc(d.DeviceID)}"`;
    const sel=d.DeviceID===selId,planned=d.Status==='Planned';
    e+=`<g class="edev" ${attr} tabindex="0"><title>${esc(d.Name)} · U${d.StartU}${d.HeightU>1?'–'+(d.StartU+d.HeightU-1):''}</title>`+
       `<rect x="32" y="${y}" width="108" height="${d.HeightU*UH-1}" rx="2" fill="color-mix(in srgb,${c} ${planned?18:45}%,var(--surface))" stroke="${sel?'var(--accent)':c}" stroke-width="${sel?2.5:1}"${planned?' stroke-dasharray="3 2"':''}/>`+
       `<text x="37" y="${y+d.HeightU*UH/2+3}" font-size="8.5" fill="var(--ink)">${esc(trunc(d.Name,17))}</text></g>`;
  });
  return e+'</svg>';
}
const locText=d=>d.HeightU>1?`U${d.StartU}–${d.StartU+d.HeightU-1}`:`U${d.StartU}`;

function renderKpis(){

  const free=R.reduce((a,r)=>a+r.free,0),tot=R.reduce((a,r)=>a+r.TotalU,0);
  const temps=R.filter(r=>r.t!==null).map(r=>r.t),hot=temps.length?Math.max(...temps):null;

   `<div class="kpi"><div class="l">${t('kLoad')}</div><div class="v">${val(fW(load),'W')}</div><div class="n">${t('kLoadN',fW(cap))}</div><div class="meter"><i style="width:${cap?Math.min(100,load/cap*100):0}%"></i></div></div>`+

   `<div class="kpi ${hot!==null&&hot>=T.TempWarnC?'bad':''}"><div class="l">${t('kTemp')}</div><div class="v">${hot===null?'—':val(f1(hot),'°C')}</div><div class="n">${hot===null?t('kTempNone'):t('kTempN')}</div></div>`+
   `<div class="kpi ${crit?'bad':''}"><div class="l">${t('kAlerts')}</div><div class="v">${num(al.length)}</div><div class="n">${t('kAlertsN',crit)}</div></div>`;
}
function renderPlan(){
  const m=S.metric,T=DB.settings;
  const rows=[...new Set(DB.racks.map(r=>r.Row))].sort(nat);
  const maxN=Math.max(1,...DB.racks.map(r=>r.Position));
  const W=maxN<=6?112:maxN<=10?88:70,G=14,H=80,X0=84,AI=48,TOP=38,compact=W<100;
  const vbW=Math.max(760,X0+maxN*(W+G)+16),vbH=TOP+rows.length*H+(rows.length-1)*AI+34;
  const fits=$('showfit').checked?new Set(fitList().filter(f=>!f.why.length).map(f=>f.r.RackID)):new Set();
  let s=`<svg viewBox="0 0 ${vbW} ${vbH}" role="img" aria-label="${esc(t('planTitle'))}" font-family="Cairo,Tahoma,Arial,sans-serif" style="min-width:${Math.round(vbW*0.8)}px">`;
  s+=`<rect x="24" y="${TOP-14}" width="${vbW-48}" height="${vbH-TOP-4}" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
  rows.forEach((rw,i)=>{
    const y=TOP+i*(H+AI);
    s+=`<text x="34" y="${y+H/2+4}" font-size="12" font-weight="700" fill="var(--muted)">${esc(t('row'))} ${esc(rw)}</text>`;
    if(i<rows.length-1)s+=`<rect x="${X0}" y="${y+H+6}" width="${maxN*(W+G)-G}" height="${AI-12}" fill="var(--blue-l)" opacity=".8"/><text x="${X0+(maxN*(W+G)-G)/2}" y="${y+H+AI/2+4}" font-size="12.5" font-weight="600" fill="var(--blue)" text-anchor="middle">${esc(t('aisle'))}</text>`;
  });
  DB.racks.forEach(r=>{
    const x=X0+(r.Position-1)*(W+G),y=TOP+rows.indexOf(r.Row)*(H+AI),v=metricVal(r,m),st=stateOf(m,v);
    const main=m==='power'?Math.round(v)+'%':m==='temp'?(v===null?'—':f1(v)+'°'):r.usedU+'/'+r.TotalU+'U';
    const sub=m==='power'?fW(r.kw)+' / '+fW(r.PowerCapW)+' W':m==='temp'?(v===null?t('none'):'°C'):r.free+' U';
    s+=`<g class="rack s-${st}${S.selRack===r.RackID?' sel':''}" data-rack="${esc(r.RackID)}" tabindex="0" role="button" aria-label="${esc(t('rack'))} ${esc(r.RackID)}: ${esc(main)}">`+
       `<rect class="rk" x="${x}" y="${y}" width="${W}" height="${H}" rx="4"/>`+
       `<text x="${x+10}" y="${y+20}" font-size="13" font-weight="700" fill="var(--ink)">${esc(r.RackID)}${r.stale?' ⚠':''}</text>`+
       `<text x="${x+W/2}" y="${y+(compact?55:50)}" font-size="${compact?17:22}" font-weight="700" fill="var(--ink)" text-anchor="middle">${esc(main)}</text>`+
       (compact?'':`<text x="${x+W/2}" y="${y+68}" font-size="11.5" fill="var(--muted)" text-anchor="middle">${esc(sub)}</text>`);
    if(fits.has(r.RackID))s+=`<rect class="fit" x="${x-4}" y="${y-4}" width="${W+8}" height="${H+8}" rx="6"/>`;
    s+='</g>';
  });
  $('plan').innerHTML=s+'</svg>';
  const th=m==='power'?t('thP',T.PowerWarnPct,T.PowerCritPct):m==='temp'?t('thT',T.TempWarnC,T.TempCritC):t('thS',T.SpaceWarnPct,T.SpaceCritPct);
  $('legend').innerHTML=`<span class="s-good"><i class="sw"></i>${t('good')}</span><span class="s-warn"><i class="sw"></i>${t('warn')}</span><span class="s-crit"><i class="sw"></i>${t('crit')}</span>`+(m==='temp'?`<span class="s-none"><i class="sw"></i>${t('none')}</span>`:'')+`<span>${esc(th)}</span>`+($('showfit').checked?`<span>${esc(t('fitKey'))}</span>`:'');
}

function resizeImage(file){
  return new Promise((res,rej)=>{
    if(String(file.type||'').indexOf('image/')!==0)return rej(new Error('E_PHOTO'));
    const fr=new FileReader();fr.onerror=()=>rej(new Error('E_PHOTO'));
    fr.onload=()=>{
      const im=new Image();im.onerror=()=>rej(new Error('E_PHOTO'));
      im.onload=()=>{
        const k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
        const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
        x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        let q=.82,u=c.toDataURL('image/jpeg',q);
        while(u.length>3800000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}
        res(u);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  const fail=(c,x)=>{throw new Error(c+(x!==undefined?'|'+x:''))};
  const int=(x,a,b,c)=>{const n=Number(x);if(x===''||x==null||!isFinite(n)||Math.floor(n)!==n||n<a||n>b)fail(c);return n};
  const nm=(x,a,b,c)=>{const n=Number(x);if(x===''||x==null||!isFinite(n)||n<a||n>b)fail(c);return n};
  const uid=()=>'D'+Math.random().toString(36).slice(2,10);
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
  function load(){try{const s=localStorage.getItem(KEY);if(s)D=JSON.parse(s)}catch(e){}}
  function addSample(){
    const now=new Date().toISOString();
    SAMPLE.forEach(r=>{
      D.racks.push({RackID:r[0],Name:r[0],Row:r[0].charAt(0),Position:Number(r[0].slice(1)),TotalU:D.settings.DefaultTotalU,PowerCapW:D.settings.DefaultPowerCapW,InletTempC:r[1],ReadingAt:now,Notes:'Sample data'});
      r[2].forEach(d=>D.devices.push({DeviceID:uid(),RackID:r[0],Name:d[0],Type:d[1],Status:d[5]||'Active',StartU:d[2],HeightU:d[3],PowerW:Math.round(d[4]*1000),Vendor:'',Model:'',Serial:'',AssetTag:'',IP:d[6]||'',Owner:'',Notes:'Sample data'}));
    });
  }
  load();
  if(!D){D={settings:Object.assign({},DEF),racks:[],devices:[]};addSample();persist()}
  const snap=()=>JSON.parse(JSON.stringify({settings:D.settings,racks:D.racks,devices:D.devices}));
  return{
    api_bootstrap(){const s=snap();s.version=APP_VERSION;s.user={email:'demo@sr.edu.sa',role:'admin'};return s},
    api_addRackPhoto(id,url){
      const m=String(url||'').slice(0,40).match(/^data:image.(jpeg|png|webp);base64,/);if(!m)fail('E_PHOTO');
      const r=D.racks.find(x=>x.RackID===id);if(!r)fail('E_RACK_NONE',id);
      r.Photos=r.Photos||[];if(r.Photos.length>=4)fail('E_PHOTO_MAX');
      const pid='P'+Math.random().toString(36).slice(2,10);P[pid]=url;
      try{pper()}catch(e){delete P[pid];throw e}
      r.Photos.push(pid);persist();return snap();
    },
    api_getRackPhoto(pid){if(!P[pid])fail('E_PHOTO_NONE');return{id:pid,data:P[pid]}},
    api_deleteRackPhoto(id,pid){
      const r=D.racks.find(x=>x.RackID===id);if(!r||!(r.Photos||[]).includes(pid))fail('E_PHOTO_NONE');
      r.Photos=r.Photos.filter(x=>x!==pid);delete P[pid];pper();persist();return snap();
    },
    api_saveSettings(s){
      const o={RoomName:String(s.RoomName||'').trim().slice(0,60)||DEF.RoomName};
      Object.keys(RULES).forEach(k=>{const r=RULES[k],n=Number(s[k]);if(s[k]===''||s[k]==null||!isFinite(n)||n<r[0]||n>r[1]||(r[2]&&Math.floor(n)!==n))fail('E_SET',k);o[k]=n});
      if(o.PowerWarnPct>=o.PowerCritPct||o.TempWarnC>=o.TempCritC||o.SpaceWarnPct>=o.SpaceCritPct)fail('E_THRESH');
      D.settings=o;persist();return snap();
    },
    api_saveRack(r,isNew){
      const id=String(r.RackID||'').trim();if(!/^[A-Za-z0-9_-]{1,12}$/.test(id))fail('E_RACK_ID');
      const row=String(r.Row||'').trim();if(!row||row.length>6)fail('E_ROW');
      const pos=int(r.Position,1,99,'E_POS'),tu=int(r.TotalU,1,60,'E_TOTALU'),cap=nm(r.PowerCapW,100,100000,'E_CAP');
      let inlet=null;if(r.InletTempC!==''&&r.InletTempC!=null)inlet=nm(r.InletTempC,0,60,'E_TEMP');
      const cur=D.racks.find(x=>x.RackID===id);
      if(isNew&&cur)fail('E_RACK_DUP',id);if(!isNew&&!cur)fail('E_RACK_NONE',id);if(isNew&&D.racks.length>=200)fail('E_LIMIT');
      const clash=D.racks.find(x=>x.RackID!==id&&x.Row===row&&x.Position===pos);if(clash)fail('E_POS_DUP',clash.RackID);
      const ends=D.devices.filter(d=>d.RackID===id&&d.Status!=='Decommissioned').map(d=>d.StartU+d.HeightU-1);
      const maxEnd=ends.length?Math.max(...ends):0;if(maxEnd>tu)fail('E_RACK_SHRINK',maxEnd);
      let at=cur?cur.ReadingAt:'';if(inlet===null)at='';else if(!cur||cur.InletTempC!==inlet)at=new Date().toISOString();
      const o={RackID:id,Name:String(r.Name||id).trim().slice(0,40),Row:row,Position:pos,TotalU:tu,PowerCapW:cap,InletTempC:inlet,ReadingAt:at,Notes:String(r.Notes||'').slice(0,200)};
      if(cur)Object.assign(cur,o);else D.racks.push(o);persist();return snap();
    },
    api_deleteRack(id){
      const i=D.racks.findIndex(x=>x.RackID===id);if(i<0)fail('E_RACK_NONE',id);
      D.racks.splice(i,1);D.devices=D.devices.filter(d=>d.RackID!==id);persist();return snap();
    },
    api_generateRacks(c){
      const rows=[];(c.rows||[]).forEach(x=>{x=String(x).trim();if(x&&!rows.includes(x))rows.push(x)});
      if(!rows.length||rows.length>10||rows.some(x=>!/^[A-Za-z0-9_-]{1,6}$/.test(x)))fail('E_GEN');
      const per=int(c.perRow,1,30,'E_GEN'),tu=int(c.totalU,1,60,'E_TOTALU'),cap=nm(c.powerCapW,100,100000,'E_CAP');
      const add=[];
      rows.forEach(rw=>{for(let i=1;i<=per;i++){
        const id=rw+(i<10?'0'+i:i);
        if(id.length>12||D.racks.some(x=>x.RackID===id||(x.Row===rw&&x.Position===i))||add.some(x=>x.RackID===id))continue;
        add.push({RackID:id,Name:id,Row:rw,Position:i,TotalU:tu,PowerCapW:cap,InletTempC:null,ReadingAt:'',Notes:''});
      }});
      if(D.racks.length+add.length>200)fail('E_LIMIT');
      D.racks.push(...add);persist();const s=snap();s.created=add.length;return s;
    },
    api_saveDevice(d){
      const name=String(d.Name||'').trim();if(!name||name.length>60)fail('E_DEV_NAME');
      if(!TYPES.includes(d.Type))fail('E_DEV_TYPE');if(!STATUSES.includes(d.Status))fail('E_DEV_STATUS');
      const rid=String(d.RackID||'').trim(),rack=D.racks.find(x=>x.RackID===rid);if(!rack)fail('E_RACK_NONE',rid);
      const st=int(d.StartU,1,60,'E_DEV_U'),h=int(d.HeightU,1,60,'E_DEV_U');
      const kw=(d.PowerW===''||d.PowerW==null)?0:nm(d.PowerW,0,50000,'E_DEV_W');
      const id0=String(d.DeviceID||''),cur=id0?D.devices.find(x=>x.DeviceID===id0):null;if(id0&&!cur)fail('E_DEV_NONE');
      if(d.Status!=='Decommissioned'){
        if(st+h-1>rack.TotalU)fail('E_DEV_RANGE',rack.TotalU);
        const cl=D.devices.find(x=>x.RackID===rid&&x.DeviceID!==id0&&x.Status!=='Decommissioned'&&x.StartU<=st+h-1&&st<=x.StartU+x.HeightU-1);
        if(cl)fail('E_DEV_OVERLAP',cl.Name);
      }
      const s=(x,n)=>String(x==null?'':x).trim().slice(0,n);
      const o={DeviceID:cur?id0:uid(),RackID:rid,Name:name,Type:d.Type,Status:d.Status,StartU:st,HeightU:h,PowerW:kw,Vendor:s(d.Vendor,60),Model:s(d.Model,60),Serial:s(d.Serial,60),AssetTag:s(d.AssetTag,40),IP:s(d.IP,45),Owner:s(d.Owner,80),Notes:s(d.Notes,300)};
      if(cur)Object.assign(cur,o);else D.devices.push(o);persist();return snap();
    },
    api_deleteDevice(id){
      const i=D.devices.findIndex(x=>x.DeviceID===id);if(i<0)fail('E_DEV_NONE');
      D.devices.splice(i,1);persist();return snap();
    },
    api_loadSample(){if(D.racks.length)fail('E_NOT_EMPTY');addSample();persist();return snap()}
  };
})();

window.__booted=1;
chrome();
reload(true);
setInterval(()=>{if(S.tab==='dash'&&!document.hidden&&$('modal').hidden&&LOADED)reload(true)},60000);
})();
